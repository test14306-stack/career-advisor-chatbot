<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Career Advisor</title>
<meta name="description" content="AI career advisor chat">
<meta name="theme-color" content="#0f5e63">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5e63'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f7f7;--panel:#fff;--ink:#16292b;--muted:#5b6f71;--line:#d9e3e3;--brand:#0f5e63;--brand-ink:#fff;--user:#0f5e63;--bot:#eaf1f1;--err:#a3231b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1819;--panel:#142224;--ink:#e6f0f0;--muted:#97aeb0;--line:#264043;--brand:#4fb3b8;--brand-ink:#08201f;--user:#1d6f75;--bot:#1b3033;--err:#ff8f86}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;background:var(--panel);padding-top:env(safe-area-inset-top)}
@media(min-width:860px){body{padding:20px}.app{border:1px solid var(--line);border-radius:16px;overflow:hidden}}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px}
header h1{font-size:1.05rem;margin:0;line-height:1.2}
header p{margin:0;font-size:.85rem;color:var(--muted)}
.grow{flex:1;min-width:0}
button{font:inherit;cursor:pointer}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px}
.ghost:hover{border-color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:20px 16px;scroll-behavior:smooth}
.welcome{text-align:center;max-width:520px;margin:6vh auto 0}
.welcome .avatar{width:64px;height:64px;border-radius:18px;margin:0 auto 14px}
.welcome .avatar svg{width:34px;height:34px}
.welcome h2{margin:0 0 6px;font-size:1.4rem}
.welcome p{color:var(--muted);margin:0 0 20px}
.starters{display:grid;gap:8px}
.starters button{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px}
.starters button:hover{border-color:var(--brand);background:var(--bot)}
.msg{display:flex;margin:0 0 12px}
.msg.user{justify-content:flex-end}
.bubble{max-width:85%;padding:10px 14px;border-radius:16px;overflow-wrap:anywhere}
.user .bubble{background:var(--user);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.bot .bubble{background:var(--bot);border-bottom-left-radius:4px}
.bubble>:first-child{margin-top:0}.bubble>:last-child{margin-bottom:0}
.bubble p,.bubble ul,.bubble ol,.bubble h3{margin:.5em 0}
.bubble h3{font-size:1rem}
.bubble code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:5px}
.tbl{overflow-x:auto}
.bubble table{border-collapse:collapse;font-size:.92rem}
.bubble th,.bubble td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.error .bubble{background:transparent;border:1px solid var(--err);color:var(--err)}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}main{scroll-behavior:auto}}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:140px}
.send{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:0 18px;font-weight:600}
.send:disabled{opacity:.5;cursor:not-allowed}
footer{font-size:.75rem;color:var(--muted);text-align:center;padding:0 16px 10px}
footer button{background:none;border:0;color:inherit;text-decoration:underline;padding:0;font-size:inherit}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:420px}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></div>
    <div class="grow"><h1 id="name">Career Advisor</h1><p id="tagline"></p></div>
    <button class="ghost" id="reset" type="button">New chat</button>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <textarea id="input" rows="1" maxlength="2000" aria-label="Your message" placeholder="Type your message here..."></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <footer><button type="button" id="privacy">Privacy notice</button> · AI-generated answers may contain mistakes.</footer>
</div>
<dialog id="dlg"><p id="privacyText"></p><form method="dialog"><button class="ghost">Close</button></form></dialog>
<script>
const $=id=>document.getElementById(id);
const log=$("log"),input=$("input"),sendBtn=$("send");
let cfg={},history=[],busy=false;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
function md(src){
  const L=src.split("\n"),o=[];let i=0;
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    let m;
    if(m=l.match(/^#{1,4}\s+(.*)/)){o.push("<h3>"+inline(m[1])+"</h3>");i++}
    else if(/^\s*[-*]\s+/.test(l)){const a=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))a.push("<li>"+inline(L[i++].replace(/^\s*[-*]\s+/,""))+"</li>");o.push("<ul>"+a.join("")+"</ul>")}
    else if(/^\s*\d+[.)]\s+/.test(l)){const a=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))a.push("<li>"+inline(L[i++].replace(/^\s*\d+[.)]\s+/,""))+"</li>");o.push("<ol>"+a.join("")+"</ol>")}
    else if(l.includes("|")&&/^\s*\|?\s*:?-{2,}/.test(L[i+1]||"")){
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      const h=cells(l);i+=2;const rows=[];while(i<L.length&&L[i].includes("|"))rows.push(cells(L[i++]));
      o.push('<div class="tbl"><table><thead><tr>'+h.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>")}
    else{const a=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s)/.test(L[i]))a.push(inline(L[i++]));o.push("<p>"+a.join("<br>")+"</p>")}
  }
  return o.join("");
}
function add(role,html,cls=""){
  const d=document.createElement("div");d.className="msg "+role+" "+cls;
  d.innerHTML='<div class="bubble"></div>';d.firstChild.innerHTML=html;
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d.firstChild;
}
function welcome(){
  log.innerHTML="";
  const w=document.createElement("div");w.className="welcome";
  w.innerHTML='<div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></div><h2></h2><p></p><div class="starters"></div>';
  w.querySelector("h2").textContent=cfg.name;w.querySelector("p").textContent=cfg.welcome;
  for(const q of cfg.starters||[]){const b=document.createElement("button");b.type="button";b.textContent=q;b.onclick=()=>ask(q);w.querySelector(".starters").append(b)}
  log.append(w);
}
function setBusy(v){busy=v;sendBtn.disabled=v;input.disabled=v;if(!v)input.focus()}
async function ask(text){
  text=text.trim();if(!text||busy)return;
  if(!history.length)log.innerHTML="";
  history.push({role:"user",content:text});
  const u=add("user","");u.textContent=text;input.value="";input.style.height="auto";
  const bot=add("bot",'<span class="dots" role="status" aria-label="AI is typing"><i></i><i></i><i></i></span>');
  setBusy(true);let acc="";
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"The AI service is unavailable. Please try again.")}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="",failed=false;
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const parts=buf.split("\n\n");buf=parts.pop();
      for(const p of parts){
        if(p.startsWith("event: error"))failed=true;
        else if(p.startsWith("data: ")&&!p.startsWith("event")){try{const t=JSON.parse(p.slice(6));if(typeof t==="string"){acc+=t;bot.innerHTML=md(acc);log.scrollTop=log.scrollHeight}}catch{}}
      }
    }
    if(failed||!acc)throw new Error("The reply was interrupted. Please try again.");
    history.push({role:"assistant",content:acc});
  }catch(e){
    history.pop();
    if(acc){bot.innerHTML=md(acc)}else bot.closest(".msg").remove();
    add("bot",esc(e.message||"Something went wrong. Please try again."),"error");
  }finally{setBusy(false)}
}
$("form").addEventListener("submit",e=>{e.preventDefault();ask(input.value)});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask(input.value)}});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"});
$("reset").onclick=()=>{if(busy)return;history=[];welcome();input.value="";input.focus()};
$("privacy").onclick=()=>$("dlg").showModal();
fetch("/api/config").then(r=>r.json()).then(c=>{
  cfg=c;document.title=c.name;$("name").textContent=c.name;$("tagline").textContent=c.tagline||"";
  input.placeholder=c.placeholder||input.placeholder;$("privacyText").textContent=c.privacyNotice||"";welcome();
}).catch(()=>{log.textContent="Could not load the chatbot. Please refresh."});
</script>
</body>
</html>
